name: Release Orinify

on:
  push:
    tags:
      - 'v*-q*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/orinify-release.jks

      - name: Build signed FOSS release
        env:
          ORINIFY_KEYSTORE_FILE: app/orinify-release.jks
          ORINIFY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORINIFY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORINIFY_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleFossRelease lintFossRelease testFossReleaseUnitTest --stacktrace -DskipFormatKtlint

      - name: Verify signature and calculate SHA-256
        run: |
          APK_PATH=$(find app/build/outputs/apk/foss/release -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          cp "$APK_PATH" "Orinify-${GITHUB_REF_NAME}.apk"
          sha256sum "Orinify-${GITHUB_REF_NAME}.apk" > "Orinify-${GITHUB_REF_NAME}.apk.sha256"
          # Without a crash reporter, the mapping file is the only way to read a stack trace
          # reported against this build. Fail the release if it is missing.
          MAPPING_PATH=app/build/outputs/mapping/fossRelease/mapping.txt
          test -f "$MAPPING_PATH"
          cp "$MAPPING_PATH" "Orinify-${GITHUB_REF_NAME}-mapping.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: orinify-${{ github.ref_name }}
          path: |
            Orinify-${{ github.ref_name }}.apk
            Orinify-${{ github.ref_name }}.apk.sha256
            Orinify-${{ github.ref_name }}-mapping.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Orinify-${GITHUB_REF_NAME}.apk" \
            "Orinify-${GITHUB_REF_NAME}.apk.sha256" \
            "Orinify-${GITHUB_REF_NAME}-mapping.txt" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
