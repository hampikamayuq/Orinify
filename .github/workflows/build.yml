name: Build Orinify
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# One build per branch. A push to a branch that already has a pull request would
# otherwise start a second, identical run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "zulu"
          cache: 'gradle'

      - name: Build FOSS debug APK, lint and unit tests
        run: >-
          ./gradlew
          assembleFossDebug lintFossDebug testFossDebugUnitTest
          :innertube:test :kugou:test :lrclib:test
          --stacktrace
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && 'true' || '' }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/build/outputs/apk/foss/debug/*.apk
