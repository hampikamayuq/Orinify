name: Build Orinify
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# One build per branch per event. The event name has to be part of the group: a pull_request run
# joins the group before the job-level condition below is evaluated, so a shared group would let it
# cancel the push run and then skip itself, leaving the commit with no build at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # A branch in this repository is already covered by its push event, so the pull_request event
    # would only duplicate it: two runs on one commit, one of them cancelled by the concurrency
    # group, leaving a cancelled check that makes every pull request read as unstable. The
    # pull_request event is kept for forks, whose commits never produce a push event here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "zulu"
          cache: 'gradle'

      - name: Build FOSS debug APK, lint and unit tests
        run: >-
          ./gradlew
          assembleFossDebug lintFossDebug testFossDebugUnitTest ktlintCheck
          :innertube:test :kugou:test :lrclib:test
          --stacktrace
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && 'true' || '' }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/build/outputs/apk/foss/debug/*.apk
