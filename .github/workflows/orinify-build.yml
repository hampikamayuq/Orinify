name: Build Orinify (debug)

# The upstream workflows sign a release with secrets this fork does not hold, so they
# cannot produce an installable artifact here. This one builds the debug variant, which
# needs no secret at all, and publishes the APKs for download.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # A branch in this repository is already covered by its push event; the pull_request
    # event is kept for forks, whose commits never produce a push event here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The core modules — data, domain and every service, the YouTube scraper
          # included — live in the `core` submodule. Without this the build cannot configure.
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # One artifact per ABI, not one holding all four. The four together are 287 MB,
      # and a phone needs exactly one of them — arm64 for anything current.
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: orinify-debug-arm64
          path: androidApp/build/outputs/apk/debug/*arm64-v8a*.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: orinify-debug-universal
          path: androidApp/build/outputs/apk/debug/*universal*.apk
